name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ios:
    name: iOS checks
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Xcode version
        run: xcodebuild -version

      - name: List Xcode project
        run: xcodebuild -list -project "Cosmo Trader.xcodeproj"

      - name: Production mock guard
        run: bash Scripts/production_mock_guard.sh

      - name: Compliance copy guard
        run: bash Scripts/compliance_copy_guard.sh

      - name: View size ratchet
        run: bash Scripts/view_size_ratchet.sh

      - name: Unit tests (full bundle)
        run: |
          xcodebuild test \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:"Cosmo TraderTests"

      # Smoke-only UI pass: launch, tab navigation, onboarding test-safe
      # path, and the offline backend-status fallback. The suite is fully
      # network-free (--uitesting --disable-firebase) so it is CI-safe;
      # the broader UI test classes stay local-only for now. Retries absorb
      # UI-timing noise on slow runners: a real break still fails all three
      # attempts.
      - name: Smoke UI tests
        run: |
          xcodebuild test \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -only-testing:"Cosmo TraderUITests/SmokeUITests"

      - name: Clean Debug build
        run: |
          xcodebuild \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
