name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ios:
    name: iOS checks
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Xcode version
        run: xcodebuild -version

      - name: List Xcode project
        run: xcodebuild -list -project "Cosmo Trader.xcodeproj"

      - name: Production mock guard
        run: bash Scripts/production_mock_guard.sh

      - name: Compliance copy guard
        run: bash Scripts/compliance_copy_guard.sh

      - name: Focused compliance tests
        run: |
          xcodebuild test \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:"Cosmo TraderTests/ComplianceCopyGuardTests"

      - name: Clean Debug build
        run: |
          xcodebuild \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
