name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS checks
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Xcode version
        run: xcodebuild -version

      - name: List Xcode project
        run: xcodebuild -list -project "Cosmo Trader.xcodeproj"

      - name: Production mock guard
        run: bash Scripts/production_mock_guard.sh

      - name: Compliance copy guard
        run: bash Scripts/compliance_copy_guard.sh

      - name: View size ratchet
        run: bash Scripts/view_size_ratchet.sh

      - name: Unit tests (full bundle)
        run: |
          xcodebuild test \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:"Cosmo TraderTests"

      # Smoke-only UI pass: launch, tab navigation, onboarding test-safe
      # path, and the offline backend-status fallback. The suite is fully
      # network-free (--uitesting --disable-firebase) so it is CI-safe;
      # the broader UI test classes stay local-only for now. One retry absorbs
      # UI-timing noise on slow runners: a real break still fails both
      # attempts.
      - name: Smoke UI tests
        env:
          # Prefixed vars pass into the test-runner process environment.
          # The backend-status journey is skipped on the CI device class;
          # see the XCTSkipIf note in SmokeUITests.
          TEST_RUNNER_SMOKE_SKIP_BACKEND_STATUS_JOURNEY: "1"
        run: |
          xcodebuild test \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -only-testing:"Cosmo TraderUITests/SmokeUITests"

      # Clean build + Release build are compile-only safety nets, not part of
      # the PR gate proper (Scripts/*.sh + the unit/UI test steps above cover
      # that). They only run on merge to main, since running them on every PR
      # push doubled macOS-runner minutes for checks that don't verify
      # behavior, just compileability.
      - name: Clean Debug build
        if: github.event_name == 'push'
        run: |
          xcodebuild \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # Release compiles code the Debug/test builds skip (e.g. #Preview
      # blocks that reference DEBUG-only samples), which is exactly what
      # breaks `xcodebuild archive` at ship time. Device target, no signing,
      # so it needs no certs. Catches Release-only build breaks in CI instead
      # of at archive.
      #
      # The Release config has a "Copy Firebase Plist (Release Required)"
      # build phase that hard-fails when GoogleService-Info.plist is absent.
      # That file is a gitignored per-environment Firebase config, so it is
      # not in CI. Its CONTENTS are read only at runtime (FirebaseApp.configure);
      # the build phase merely copies the file, so a throwaway placeholder with
      # obviously-fake values satisfies the compile check. This build only
      # compiles (no archive, no distribution), so the placeholder never ships.
      - name: Release build (device, unsigned)
        if: github.event_name == 'push'
        run: |
          cat > "GoogleService-Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder-not-a-real-key</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.Somnora.Cosmo-Trader</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key><string>ci-placeholder.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -project "Cosmo Trader.xcodeproj" \
            -scheme "Cosmo Trader" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
          rm -f "GoogleService-Info.plist"
